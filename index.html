<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🐸 奶蛙幸运老虎机 · NAIWA SLOTS</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Luckiest+Guy&family=Russo+One&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;user-select:none;overflow-x:hidden}

body{
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  min-height:100vh;
  background:
    radial-gradient(ellipse at 50% 0%, #8B0000 0%, #4a0000 30%, #1a0000 60%, #0a0000 100%);
  padding:16px 12px 32px;
  font-family:'Russo One', sans-serif;
}

/* ===== 顶部标题 ===== */
.page-title{text-align:center;margin-bottom:12px}
.page-title h1{
  font-family:'Luckiest Guy',cursive;
  font-size:38px;
  background:linear-gradient(180deg,#FFD700 0%,#FF8C00 50%,#FF4500 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  letter-spacing:3px;
  filter:
    drop-shadow(3px 3px 0 #8B0000)
    drop-shadow(4px 4px 0 #5a0000)
    drop-shadow(5px 5px 8px rgba(0,0,0,.7))
    drop-shadow(0 0 20px rgba(255,215,0,.5));
}
.page-title p{
  font-family:'Bungee',cursive;font-size:13px;color:#FFD700;margin-top:3px;
  text-shadow:2px 2px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,0 0 10px rgba(255,215,0,.5);
  letter-spacing:4px;
}

/* ===== 钱包 ===== */
.wallet{
  position:fixed;top:10px;right:10px;z-index:200;
  display:flex;align-items:center;gap:8px;
  background:linear-gradient(135deg,#FFD700,#FFA500);
  border:3px solid #8B0000;border-radius:12px;padding:7px 13px;
  box-shadow:0 4px 16px rgba(0,0,0,.5),inset 0 2px 4px rgba(255,255,255,.3),0 0 22px rgba(255,215,0,.4);
  animation:walletGlow 2s ease-in-out infinite;
}
@keyframes walletGlow{0%,100%{box-shadow:0 4px 16px rgba(0,0,0,.5),0 0 18px rgba(255,215,0,.3)}50%{box-shadow:0 4px 16px rgba(0,0,0,.5),0 0 38px rgba(255,215,0,.6)}}
.wallet-label{font-family:'Bungee',cursive;font-size:9px;color:#8B0000;font-weight:700;text-shadow:1px 1px 0 rgba(255,255,255,.5)}
.wallet-amount{font-family:'Luckiest Guy',cursive;font-size:20px;color:#8B0000;letter-spacing:1px;text-shadow:2px 2px 0 #FFD700,3px 3px 0 #B8860B,4px 4px 6px rgba(0,0,0,.5);transition:color .2s}
.wallet-amount.gain{color:#228B22;text-shadow:2px 2px 0 #90EE90,3px 3px 0 #228B22,4px 4px 6px rgba(0,0,0,.5)}
.wallet-amount.loss{color:#8B0000}
.wallet-icon{font-size:20px;filter:drop-shadow(1px 1px 0 rgba(0,0,0,.5))}

/* ===== 静音按钮 ===== */
.sound-toggle{
  position:fixed;top:10px;left:10px;z-index:200;
  width:42px;height:42px;border-radius:50%;
  background:linear-gradient(135deg,#8B0000,#DC143C);
  border:3px solid #FFD700;color:#FFD700;font-size:18px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:0 4px 12px rgba(0,0,0,.5),inset 0 2px 4px rgba(255,255,255,.2);
}

/* ===== 老虎机机身 ===== */
.machine{
  position:relative;display:flex;align-items:stretch;
  filter:drop-shadow(0 18px 50px rgba(0,0,0,.6));
  transition:transform .08s;
  max-width:100%;
}
.machine.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translate(0,0)}15%{transform:translate(-5px,3px)}30%{transform:translate(5px,-3px)}45%{transform:translate(-4px,2px)}60%{transform:translate(4px,-2px)}75%{transform:translate(-2px,1px)}}

.cabinet{
  position:relative;width:360px;
  background:
    linear-gradient(135deg,#5a4a1a 0%,#8a6a2a 12%,#c9a84c 28%,#f0d97a 45%,#c9a84c 62%,#8a6a2a 82%,#4a3a10 100%);
  border-radius:24px 24px 18px 18px;padding:16px 14px 18px;
  border:3px solid #f0d97a;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.4),inset 0 -4px 12px rgba(0,0,0,.3),0 0 0 2px #6a5a20,0 0 30px rgba(240,217,122,.3);
}

/* ===== 跑马灯 ===== */
.marquee{
  display:flex;justify-content:center;gap:5px;
  margin-bottom:12px;padding:6px;
  background:linear-gradient(180deg,#1a0508,#2a0a10);
  border-radius:10px;border:1.5px solid #6a5a20;
  box-shadow:inset 0 2px 6px rgba(0,0,0,.6);
}
.marquee .bulb{width:9px;height:9px;border-radius:50%;background:#3a2210;transition:all .15s}
.marquee .bulb.on{background:radial-gradient(circle at 35% 35%,#fff,#ffe88a 40%,#f0a020);box-shadow:0 0 8px #ffd040,0 0 16px rgba(255,208,64,.5)}
.marquee .bulb.on.blue{background:radial-gradient(circle at 35% 35%,#fff,#b0e8ff 40%,#2090d0);box-shadow:0 0 8px #40c0ff,0 0 16px rgba(64,192,255,.5)}
.marquee .bulb.on.red{background:radial-gradient(circle at 35% 35%,#fff,#ffb0b0 40%,#d02020);box-shadow:0 0 8px #ff4040,0 0 16px rgba(255,64,64,.5)}

.title-bar{
  text-align:center;margin-bottom:12px;
  font-family:'Luckiest Guy',cursive;font-size:20px;letter-spacing:3px;color:#FFD700;
  text-shadow:2px 2px 0 #8B0000,-1px -1px 0 #8B0000,1px -1px 0 #8B0000,-1px 1px 0 #8B0000,3px 3px 0 #5a0000,0 0 14px rgba(255,208,64,.7);
}

/* ===== 滚轮区 ===== */
.reel-window{
  display:flex;gap:7px;
  background:linear-gradient(180deg,#0a0508,#1a0e18);
  border-radius:12px;padding:9px;
  border:2px solid #6a5a20;
  box-shadow:inset 0 4px 12px rgba(0,0,0,.8),inset 0 -2px 6px rgba(0,0,0,.6);
  position:relative;
}
.reel{
  flex:1;height:222px;overflow:hidden;position:relative;
  background:linear-gradient(180deg,#fafaf0,#e8e0d0);
  border-radius:8px;
  box-shadow:inset 0 0 0 2px #c9a84c,inset 0 2px 8px rgba(0,0,0,.2);
}
.reel::before,.reel::after{content:'';position:absolute;left:0;right:0;height:54px;z-index:5;pointer-events:none}
.reel::before{top:0;background:linear-gradient(180deg,rgba(10,5,8,.92),transparent)}
.reel::after{bottom:0;background:linear-gradient(0deg,rgba(10,5,8,.92),transparent)}
.reel-strip{position:absolute;left:0;right:0;top:0;display:flex;flex-direction:column;align-items:center;will-change:transform}
.symbol{
  height:74px;display:flex;align-items:center;justify-content:center;
  font-size:50px;line-height:1;
  text-shadow:0 2px 3px rgba(0,0,0,.25),1px 1px 0 rgba(0,0,0,.3);
}
.symbol img{height:60px;width:60px;object-fit:contain;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
.symbol.naiwa img{filter:drop-shadow(0 0 8px rgba(255,215,0,.6)) brightness(1.08)}

/* 中奖线 */
.payline{
  position:absolute;left:7px;right:7px;top:50%;height:74px;
  transform:translateY(-50%);
  border-top:2px solid rgba(255,208,64,.6);border-bottom:2px solid rgba(255,208,64,.6);
  background:linear-gradient(90deg,transparent,rgba(255,208,64,.08),transparent);
  pointer-events:none;z-index:6;animation:paylinePulse 1.5s ease-in-out infinite;
}
@keyframes paylinePulse{0%,100%{box-shadow:0 0 12px rgba(255,208,64,.2)}50%{box-shadow:0 0 24px rgba(255,208,64,.5)}}
.payline.tease{animation:paylineFlash .3s ease-in-out 3}
@keyframes paylineFlash{0%,100%{border-color:rgba(255,208,64,.6)}50%{border-color:rgba(255,144,64,.95);box-shadow:0 0 30px rgba(255,144,64,.6)}}
.payline.win{animation:paylineWin .25s ease-in-out 4}
@keyframes paylineWin{0%,100%{border-color:rgba(50,205,50,.7);box-shadow:0 0 18px rgba(50,205,50,.4)}50%{border-color:rgba(255,215,0,1);box-shadow:0 0 36px rgba(255,215,0,.8)}}
.payline.jackpot{animation:paylineJackpot .2s ease-in-out 8}
@keyframes paylineJackpot{0%,100%{border-color:rgba(255,215,0,.8);box-shadow:0 0 30px rgba(255,215,0,.5)}50%{border-color:rgba(255,69,0,1);box-shadow:0 0 50px rgba(255,69,0,.9),0 0 70px rgba(255,215,0,.6)}}

/* 中奖滚轮高亮 */
.reel.win-highlight{box-shadow:inset 0 0 0 3px #FFD700,inset 0 0 18px rgba(255,215,0,.6),0 0 16px rgba(255,215,0,.5)}
.reel.jackpot-highlight{animation:reelJackpot .3s ease-in-out 5}
@keyframes reelJackpot{0%,100%{box-shadow:inset 0 0 0 3px #FFD700,inset 0 0 18px rgba(255,215,0,.7)}50%{box-shadow:inset 0 0 0 4px #FF4500,inset 0 0 26px rgba(255,69,0,.8),0 0 28px rgba(255,69,0,.7)}}}

/* 奶蛙吞钱：滚轮血红高亮 */
.reel.devour-highlight{animation:reelDevour .25s ease-in-out 6}
@keyframes reelDevour{0%,100%{box-shadow:inset 0 0 0 3px #8B0000,inset 0 0 18px rgba(139,0,0,.7)}50%{box-shadow:inset 0 0 0 4px #FF0000,inset 0 0 30px rgba(255,0,0,.9),0 0 32px rgba(255,0,0,.8)}}
.payline.devour{animation:paylineDevour .2s ease-in-out 8}
@keyframes paylineDevour{0%,100%{border-color:rgba(139,0,0,.9);box-shadow:0 0 30px rgba(139,0,0,.6)}50%{border-color:#FF0000;box-shadow:0 0 50px rgba(255,0,0,.9),0 0 70px rgba(139,0,0,.7)}}
.status.devour{font-size:20px;color:#FF4500;text-shadow:0 0 16px rgba(255,0,0,.9),2px 2px 0 #2a0000;animation:devourText .25s ease infinite alternate}
@keyframes devourText{from{transform:scale(1)}to{transform:scale(1.06)}}
.flash.devour{background:radial-gradient(circle,rgba(255,0,0,.65),rgba(139,0,0,.4) 40%,transparent 75%);animation:flashFade 1s ease-out forwards}
.paytable-grid .devour-row{background:linear-gradient(90deg,rgba(139,0,0,.3),rgba(255,0,0,.25),rgba(139,0,0,.3));border:1px solid rgba(255,0,0,.5)}
.paytable-grid .devour-row .amt{color:#FF0000;font-size:11px}

/* ===== 赔率表 ===== */
.paytable{
  margin-top:10px;padding:7px 9px;
  background:linear-gradient(180deg,#2a0a10,#1a0508);
  border:1.5px solid #6a5a20;border-radius:8px;
  box-shadow:inset 0 2px 6px rgba(0,0,0,.6);
}
.paytable-title{font-family:'Luckiest Guy',cursive;text-align:center;font-size:11px;color:#FFD700;letter-spacing:2px;margin-bottom:5px;text-shadow:1px 1px 0 #8B0000,0 0 8px rgba(255,215,0,.5)}
.paytable-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px 6px;font-family:'Russo One',sans-serif;font-size:9px;color:#ffe88a}
.paytable-grid div{display:flex;align-items:center;justify-content:space-between;gap:2px;background:rgba(255,215,0,.06);padding:2px 5px;border-radius:4px}
.paytable-grid .sym{font-size:13px}
.paytable-grid .amt{color:#FFD700;font-weight:700;text-shadow:0 0 6px rgba(255,215,0,.6)}
.paytable-grid .jackpot-row{grid-column:1/-1;background:linear-gradient(90deg,rgba(255,69,0,.2),rgba(255,215,0,.2),rgba(255,69,0,.2));border:1px solid rgba(255,215,0,.4);animation:jackpotRow 1.2s ease-in-out infinite}
@keyframes jackpotRow{0%,100%{box-shadow:0 0 6px rgba(255,215,0,.3)}50%{box-shadow:0 0 16px rgba(255,69,0,.6)}}
.paytable-grid .jackpot-row .amt{color:#FF4500;font-size:11px}

/* ===== 下注控制 ===== */
.bet-controls{
  margin-top:10px;display:flex;align-items:center;justify-content:center;gap:10px;
}
.bet-label{font-family:'Bungee',cursive;font-size:11px;color:#FFD700;letter-spacing:1px;text-shadow:1px 1px 0 #8B0000}
.bet-box{
  display:flex;align-items:center;gap:6px;
  background:linear-gradient(180deg,#1a0508,#2a0a10);
  border:2px solid #FFD700;border-radius:10px;padding:4px 6px;
  box-shadow:inset 0 2px 6px rgba(0,0,0,.6),0 0 10px rgba(255,215,0,.2);
}
.bet-btn{
  width:28px;height:28px;border-radius:50%;border:2px solid #FFD700;cursor:pointer;
  background:linear-gradient(180deg,#DC143C,#8B0000);color:#FFD700;font-size:18px;font-weight:900;
  display:flex;align-items:center;justify-content:center;line-height:1;
  box-shadow:0 2px 4px rgba(0,0,0,.5),inset 0 1px 2px rgba(255,255,255,.3);
  transition:transform .1s;
}
.bet-btn:active{transform:scale(.9)}
.bet-amount{font-family:'Luckiest Guy',cursive;font-size:20px;color:#FFD700;min-width:54px;text-align:center;text-shadow:1px 1px 0 #8B0000,0 0 8px rgba(255,215,0,.6)}

/* ===== SPIN 按钮 ===== */
.spin-row{display:flex;align-items:center;gap:10px;margin-top:12px}
.spin-btn{
  flex:1;height:62px;border:none;cursor:pointer;
  border-radius:14px;
  background:linear-gradient(180deg,#FF4500 0%,#DC143C 45%,#8B0000 100%);
  border:3px solid #FFD700;
  font-family:'Luckiest Guy',cursive;font-size:26px;color:#FFD700;letter-spacing:4px;
  text-shadow:2px 2px 0 #5a0000,-1px -1px 0 #5a0000,1px -1px 0 #5a0000,-1px 1px 0 #5a0000,0 0 12px rgba(255,215,0,.7);
  box-shadow:0 6px 0 #5a0000,0 8px 18px rgba(0,0,0,.5),inset 0 2px 4px rgba(255,255,255,.3),inset 0 -4px 8px rgba(0,0,0,.3),0 0 24px rgba(255,69,0,.4);
  transition:transform .08s,box-shadow .08s;
  position:relative;overflow:hidden;
}
.spin-btn::before{content:'';position:absolute;top:3px;left:8%;right:8%;height:32%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.45),transparent);pointer-events:none}
.spin-btn:hover{box-shadow:0 6px 0 #5a0000,0 8px 18px rgba(0,0,0,.5),inset 0 2px 4px rgba(255,255,255,.3),inset 0 -4px 8px rgba(0,0,0,.3),0 0 36px rgba(255,69,0,.7)}
.spin-btn:active{transform:translateY(5px);box-shadow:0 1px 0 #5a0000,0 3px 8px rgba(0,0,0,.5),inset 0 2px 4px rgba(255,255,255,.3),inset 0 -4px 8px rgba(0,0,0,.3)}
.spin-btn:disabled{cursor:not-allowed;opacity:.65;filter:saturate(.5)}
.spin-btn.pulsing{animation:spinPulse 1s ease-in-out infinite}
@keyframes spinPulse{0%,100%{box-shadow:0 6px 0 #5a0000,0 8px 18px rgba(0,0,0,.5),inset 0 2px 4px rgba(255,255,255,.3),0 0 24px rgba(255,69,0,.4)}50%{box-shadow:0 6px 0 #5a0000,0 8px 18px rgba(0,0,0,.5),inset 0 2px 4px rgba(255,255,255,.3),0 0 44px rgba(255,215,0,.8)}}}

/* ===== 拉杆 ===== */
.lever-area{display:flex;flex-direction:column;align-items:center;padding-top:4px}
.lever-track{position:relative;width:30px;height:62px;background:linear-gradient(180deg,#1a0508,#2a0a10);border-radius:16px;border:2px solid #6a5a20;box-shadow:inset 0 2px 8px rgba(0,0,0,.8)}
.lever-rod{position:absolute;left:50%;top:0;width:7px;height:30px;transform:translateX(-50%) translateY(0);background:linear-gradient(90deg,#888,#ddd 40%,#fff 50%,#ddd 60%,#888);border-radius:4px;transition:transform .12s cubic-bezier(.3,1.5,.6,1);z-index:2}
.lever-knob{position:absolute;left:50%;top:-16px;width:26px;height:26px;border-radius:50%;transform:translateX(-50%);background:radial-gradient(circle at 35% 30%,#ff8080,#e02020 50%,#800808);box-shadow:0 3px 6px rgba(0,0,0,.5),inset -3px -3px 6px rgba(0,0,0,.4),inset 3px 3px 6px rgba(255,255,255,.3),0 0 12px rgba(224,32,32,.4);cursor:grab;z-index:3;transition:transform .12s cubic-bezier(.3,1.5,.6,1)}
.lever-knob:active{cursor:grabbing}

/* ===== 状态 ===== */
.status{margin-top:11px;text-align:center;min-height:30px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;letter-spacing:1px;color:#fff8e0;text-shadow:0 0 8px rgba(255,208,64,.5);transition:all .2s}
.status.tease{color:#ff9040;text-shadow:0 0 12px rgba(255,144,64,.7);animation:tease .3s ease 2}
@keyframes tease{50%{transform:scale(1.1)}}
.status.miss{color:#aaa}
.status.win{color:#90EE90;text-shadow:0 0 14px rgba(144,238,144,.8);animation:winPulse .4s ease 2}
@keyframes winPulse{50%{transform:scale(1.12)}}
.status.jackpot{font-size:20px;color:#FFD700;text-shadow:0 0 16px rgba(255,215,0,.9),2px 2px 0 #8B0000;animation:jackpotText .3s ease infinite alternate}
@keyframes jackpotText{from{transform:scale(1)}to{transform:scale(1.08)}}
.spin-count{margin-top:5px;text-align:center;font-size:11px;color:#c9a84c;opacity:.8}

/* ===== 粒子 ===== */
.particle{position:fixed;pointer-events:none;z-index:9999;font-size:20px;animation:particleFly 1s ease-out forwards}
@keyframes particleFly{0%{opacity:1;transform:translate(0,0) scale(1) rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3) rotate(var(--rot))}}

/* ===== 全屏闪光 ===== */
.flash{position:fixed;inset:0;pointer-events:none;z-index:9990;opacity:0}
.flash.win{background:radial-gradient(circle,rgba(255,215,0,.5),transparent 70%);animation:flashFade .6s ease-out forwards}
.flash.jackpot{background:radial-gradient(circle,rgba(255,69,0,.6),rgba(255,215,0,.3) 40%,transparent 75%);animation:flashFade 1s ease-out forwards}
@keyframes flashFade{0%{opacity:0}20%{opacity:1}100%{opacity:0}}

/* ===== 弹窗 ===== */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:1000;padding:16px;backdrop-filter:blur(3px)}
.modal-mask.show{display:flex;animation:maskIn .2s ease}
@keyframes maskIn{from{opacity:0}to{opacity:1}}
.modal{
  width:100%;max-width:380px;
  background:linear-gradient(180deg,#FFFEF0 0%,#FFF8DC 50%,#FFE4B5 100%);
  border-radius:18px;border:3px solid #8B0000;
  box-shadow:0 0 0 4px #FFD700,0 15px 40px rgba(0,0,0,.6),inset 0 2px 0 rgba(255,255,255,.8);
  padding:22px 20px;text-align:center;position:relative;
  animation:modalIn .35s cubic-bezier(.17,.67,.3,1.33);
}
@keyframes modalIn{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.modal h2{font-family:'Luckiest Guy',cursive;font-size:26px;color:#8B0000;letter-spacing:2px;text-shadow:2px 2px 0 #FFD700,3px 3px 4px rgba(0,0,0,.3);margin-bottom:10px}
.modal h2.jackpot{background:linear-gradient(180deg,#FFD700,#FF4500);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(2px 2px 0 #8B0000);animation:jackpotText .3s ease infinite alternate}
.modal p{font-family:'Russo One',sans-serif;font-size:13px;color:#5a3a1a;line-height:1.7;margin-bottom:8px}
.modal .big-amount{font-family:'Luckiest Guy',cursive;font-size:42px;color:#228B22;margin:8px 0;text-shadow:2px 2px 0 #90EE90,3px 3px 6px rgba(0,0,0,.3);animation:winPulse .5s ease 3}
.modal .big-amount.jp{color:#FF4500;text-shadow:2px 2px 0 #FFD700,3px 3px 6px rgba(0,0,0,.3)}
.modal .win-frog{margin:6px auto 10px;width:70px;height:70px}
.modal .win-frog img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 14px rgba(255,215,0,.8)) drop-shadow(2px 2px 0 rgba(0,0,0,.4))}
.modal .broke-frog{width:96px;height:96px;animation:brokeFrogShake .3s ease-in-out infinite}
.modal .broke-frog img{filter:drop-shadow(0 0 16px rgba(255,0,0,.9)) drop-shadow(0 0 28px rgba(139,0,0,.7)) drop-shadow(2px 2px 0 rgba(0,0,0,.5)) brightness(.9) contrast(1.2)}
@keyframes brokeFrogShake{0%,100%{transform:rotate(-4deg) scale(1)}25%{transform:rotate(4deg) scale(1.03)}50%{transform:rotate(-3deg) scale(1)}75%{transform:rotate(3deg) scale(1.03)}}
.modal .rules{text-align:left;font-size:12px;line-height:1.8;color:#5a3a1a;margin:8px 4px}
.modal .rules b{color:#8B0000}
.modal .paylist{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:8px 0;font-size:11px;color:#5a3a1a}
.modal .paylist div{background:rgba(139,0,0,.08);padding:3px 5px;border-radius:5px;display:flex;justify-content:space-between}
.modal-btn{
  margin-top:10px;width:100%;height:50px;border:none;cursor:pointer;border-radius:12px;
  background:linear-gradient(180deg,#FF4500,#DC143C 50%,#8B0000);border:2.5px solid #FFD700;
  font-family:'Luckiest Guy',cursive;font-size:18px;color:#FFD700;letter-spacing:2px;
  text-shadow:2px 2px 0 #5a0000,0 0 10px rgba(255,215,0,.6);
  box-shadow:0 5px 0 #5a0000,0 7px 14px rgba(0,0,0,.4),inset 0 2px 4px rgba(255,255,255,.3);
  transition:transform .08s,box-shadow .08s;
}
.modal-btn:active{transform:translateY(4px);box-shadow:0 1px 0 #5a0000,0 3px 8px rgba(0,0,0,.4),inset 0 2px 4px rgba(255,255,255,.3)}
.modal-btn.green{background:linear-gradient(180deg,#32CD32,#228B22 50%,#006400);box-shadow:0 5px 0 #003d00,0 7px 14px rgba(0,0,0,.4),inset 0 2px 4px rgba(255,255,255,.3);text-shadow:2px 2px 0 #003d00,0 0 10px rgba(144,238,144,.6)}
.modal-btn.green:active{box-shadow:0 1px 0 #003d00,0 3px 8px rgba(0,0,0,.4),inset 0 2px 4px rgba(255,255,255,.3)}

@media(max-width:420px){
  .page-title h1{font-size:30px}
  .cabinet{width:320px;padding:13px 11px 15px}
  .reel{height:192px}
  .symbol{height:64px;font-size:42px}
  .symbol img{height:52px;width:52px}
  .payline{height:64px}
  .spin-btn{height:56px;font-size:22px}
  .wallet-amount{font-size:18px}
}

/* ============ 美式高端感 V2 升级 ============ */
/* 金属拉丝机身 + 皮革底板 + 左右霓虹侧柱 */
body{
  background:
    radial-gradient(ellipse at 50% -10%, #3a2820 0%, #1a0f0a 40%, #000 100%);
  position:relative;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse at 10% 20%, rgba(255,69,0,.15), transparent 40%),
    radial-gradient(ellipse at 90% 30%, rgba(255,215,0,.15), transparent 45%),
    radial-gradient(ellipse at 50% 90%, rgba(139,0,0,.3), transparent 60%);
}

/* 外层灯箱架（机身外框） */
.machine{
  position:relative;
  padding:10px 14px 14px;
  background:
    linear-gradient(180deg,#2a1810 0%, #140a05 100%);
  border-radius:28px 28px 22px 22px;
  box-shadow:
    0 0 0 1px #000,
    0 0 0 3px #8B0000,
    0 0 0 5px #FFD700,
    0 30px 70px rgba(0,0,0,.85),
    inset 0 1px 0 rgba(255,255,255,.08);
  z-index:1;
}
/* 左右霓虹柱 */
.machine::before,.machine::after{
  content:'';position:absolute;top:14px;bottom:14px;width:10px;border-radius:6px;z-index:-1;
  background:linear-gradient(180deg,rgba(255,69,0,.2),rgba(255,215,0,.5) 50%,rgba(255,69,0,.2));
  box-shadow:0 0 18px rgba(255,69,0,.7),0 0 36px rgba(255,215,0,.5),inset 0 0 8px rgba(255,255,255,.4);
  animation:neonPillar 1.6s ease-in-out infinite alternate;
}
.machine::before{left:-6px}
.machine::after{right:-6px;animation-delay:.3s}
@keyframes neonPillar{from{opacity:.85;filter:saturate(.9)}to{opacity:1;filter:saturate(1.4)}}

/* 皮革面板底纹 */
.cabinet{
  width:380px;
  background:
    radial-gradient(ellipse at 50% 0%, #5a3a22 0%, transparent 55%),
    repeating-linear-gradient(0deg, rgba(0,0,0,.08) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, rgba(0,0,0,.08) 0 1px, transparent 1px 3px),
    linear-gradient(135deg,#8B5A2B 0%,#A67C4D 15%,#D4AF6A 35%,#E8CF8C 50%,#D4AF6A 65%,#A67C4D 85%,#6B4220 100%);
  border-radius:20px 20px 16px 16px;
  padding:16px 14px 18px;
  border:2px solid rgba(255,255,255,.2);
  box-shadow:
    inset 0 3px 0 rgba(255,255,255,.35),
    inset 0 -6px 14px rgba(0,0,0,.4),
    inset 0 0 0 1px rgba(0,0,0,.45),
    0 0 0 2px #3a2820,
    0 0 40px rgba(255,215,0,.15);
}
/* 机身四角铆钉 */
.cabinet::before,.cabinet::after{
  content:'';position:absolute;width:12px;height:12px;border-radius:50%;
  background:radial-gradient(circle at 30% 25%, #fff,#d0d0d0 50%,#404040 100%);
  box-shadow:inset 0 1px 2px rgba(255,255,255,.4),0 2px 4px rgba(0,0,0,.6);
  pointer-events:none;
}
.cabinet::before{left:7px;top:7px}
.cabinet::after{right:7px;bottom:7px}

/* 顶部大奖牌（TOP MARQUEE） */
.top-topper{
  position:relative;margin-bottom:10px;padding:10px 8px 8px;
  background:
    linear-gradient(180deg,#4a0000 0%, #8B0000 50%, #6a0000 100%);
  border-radius:14px 14px 8px 8px;
  border:2px solid #FFD700;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.25),
    inset 0 -3px 10px rgba(0,0,0,.5),
    0 0 0 2px #3a2820,
    0 0 24px rgba(255,69,0,.4);
  text-align:center;
  overflow:hidden;
}
.top-topper::before{
  content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(-45deg,transparent 0 12px,rgba(255,255,255,.06) 12px 14px);
  pointer-events:none;
}
.topper-main{
  font-family:'Luckiest Guy',cursive;font-size:22px;letter-spacing:3px;color:#FFD700;
  text-shadow:
    2px 2px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,
    3px 3px 0 #6a0000,
    0 0 16px rgba(255,215,0,.8),0 0 28px rgba(255,69,0,.5);
  position:relative;
}
.topper-sub{
  font-family:'Bungee',cursive;font-size:9px;letter-spacing:3px;color:#FFA500;margin-top:2px;
  text-shadow:1px 1px 0 #000,0 0 8px rgba(255,165,0,.6);
}

/* 滚轮区升级：金属内框 + 玻璃反射 */
.reel-window{
  padding:10px;gap:8px;
  background:
    linear-gradient(180deg,#120806,#2a120a 50%,#120806),
    repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0 1px,transparent 1px 2px);
  border-radius:14px;
  border:2px solid #000;
  box-shadow:
    inset 0 0 0 3px #6a5a20,
    inset 0 0 0 5px #2a1e0a,
    inset 0 6px 16px rgba(0,0,0,.9),
    inset 0 -4px 10px rgba(0,0,0,.7),
    0 0 0 2px rgba(0,0,0,.6),
    0 0 20px rgba(0,0,0,.6);
  position:relative;
}
.reel-window::after{
  content:'';position:absolute;top:8px;left:8%;right:8%;height:35%;border-radius:50%;
  background:linear-gradient(180deg,rgba(255,255,255,.16),transparent);pointer-events:none;z-index:7;
}
.reel{
  height:228px;
  background:
    linear-gradient(180deg,#fffef5 0%, #f5ecd2 60%, #e8d9a8 100%),
    repeating-linear-gradient(0deg,rgba(0,0,0,.03) 0 2px,transparent 2px 4px);
  border-radius:10px;
  box-shadow:
    inset 0 0 0 2px #c9a84c,
    inset 0 0 0 4px rgba(0,0,0,.25),
    inset 0 3px 8px rgba(0,0,0,.3),
    inset 0 -2px 5px rgba(0,0,0,.2);
}
.symbol{
  height:76px;font-size:52px;
  text-shadow:1px 2px 0 rgba(0,0,0,.45),2px 3px 5px rgba(0,0,0,.4);
  transition:transform .12s;
}
.symbol img{height:62px;width:62px;
  filter:drop-shadow(1px 2px 0 rgba(0,0,0,.5));
}
.symbol.naiwa img{
  filter:drop-shadow(0 0 10px rgba(255,215,0,.8)) brightness(1.12);
}
/* 性能：移除 naiwaGlow 无限 filter 动画（30 个 naiwa 同时动画 filter 极耗 GPU），改用静态发光 */

/* 滚轮停止强顿挫：每个滚轮独立的"卡嗒"动画类 */
.reel.jolt{animation:reelJolt .12s ease 2}
@keyframes reelJolt{0%{transform:translateY(0)}50%{transform:translateY(6px)}100%{transform:translateY(0)}}

/* 中奖线 — 金属条发光 */
.payline{
  left:10px;right:10px;height:76px;
  border-top:2px dashed rgba(255,255,255,.3);
  border-bottom:2px dashed rgba(255,255,255,.3);
  background:linear-gradient(90deg,transparent,rgba(255,215,0,.12) 50%,transparent);
}

/* 倍率表升级：美式赌场大面板 */
.paytable{
  padding:8px 10px;border-radius:10px;
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 2px,transparent 2px 4px),
    linear-gradient(180deg,#2a0c06,#1a0604);
  border:1.5px solid #000;
  box-shadow:
    inset 0 0 0 1px #8B5A2B,
    inset 0 2px 6px rgba(0,0,0,.8),
    0 0 0 2px rgba(0,0,0,.6);
}
.paytable-title{font-size:12px;letter-spacing:3px}
.paytable-grid div{
  background:linear-gradient(180deg,rgba(255,215,0,.11),rgba(255,69,0,.08));
  border:1px solid rgba(255,215,0,.25);
  padding:3px 6px;
}
.paytable-grid .amt{color:#FFD700;text-shadow:0 0 8px rgba(255,215,0,.8)}

/* 下注面板：豪华金属 */
.bet-box{
  background:
    linear-gradient(180deg,#1a0604,#2a0c06);
  border:2px solid #000;
  box-shadow:
    inset 0 0 0 1px #FFD700,
    inset 0 2px 6px rgba(0,0,0,.7),
    0 0 0 2px rgba(0,0,0,.5),
    0 0 12px rgba(255,215,0,.22);
}
.bet-btn{
  width:32px;height:32px;border:2px solid #000;
  background:
    radial-gradient(circle at 30% 25%, #ffa080, #e04020 50%, #6a0808 100%);
  color:#fff;font-weight:900;
  text-shadow:1px 1px 0 #000;
  box-shadow:
    0 4px 0 #3a0505,
    0 5px 10px rgba(0,0,0,.5),
    inset 0 1px 2px rgba(255,255,255,.35),
    inset 0 -2px 4px rgba(0,0,0,.4);
  transition:transform .06s,box-shadow .06s;
}
.bet-btn:active{
  transform:translateY(3px);
  box-shadow:
    0 1px 0 #3a0505,
    0 2px 6px rgba(0,0,0,.5),
    inset 0 1px 2px rgba(255,255,255,.35),
    inset 0 -2px 4px rgba(0,0,0,.4);
}

/* SPIN 按钮：重型老虎机大按钮（更厚更深阴影） */
.spin-btn{
  height:70px;border-radius:16px;
  background:
    radial-gradient(ellipse at 50% 15%, #ffb060 0%, #ff5a20 30%, #d01810 60%, #800606 100%);
  border:3px solid #000;
  box-shadow:
    0 10px 0 #3a0505,
    0 14px 22px rgba(0,0,0,.6),
    inset 0 2px 0 rgba(255,255,255,.45),
    inset 0 -6px 12px rgba(0,0,0,.45),
    inset 0 0 0 2px rgba(255,215,0,.4),
    0 0 30px rgba(255,69,0,.45);
  font-size:30px;letter-spacing:5px;
  color:#FFD700;
  text-shadow:
    2px 2px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,
    3px 3px 0 #5a0000,
    0 0 16px rgba(255,215,0,.85);
  position:relative;overflow:hidden;
  transition:transform .07s ease,box-shadow .07s ease;
}
.spin-btn::before{
  content:'';position:absolute;top:5px;left:8%;right:8%;height:32%;border-radius:50%;
  background:linear-gradient(180deg,rgba(255,255,255,.55),transparent);
  pointer-events:none;
}
.spin-btn::after{
  content:'';position:absolute;top:12%;left:12%;width:30%;height:22%;border-radius:50%;
  background:radial-gradient(ellipse,rgba(255,255,255,.55),transparent 70%);
  pointer-events:none;
  filter:blur(2px);
}
.spin-btn:hover{
  box-shadow:
    0 10px 0 #3a0505,
    0 14px 22px rgba(0,0,0,.6),
    inset 0 2px 0 rgba(255,255,255,.45),
    inset 0 -6px 12px rgba(0,0,0,.45),
    inset 0 0 0 2px rgba(255,215,0,.4),
    0 0 46px rgba(255,215,0,.6);
}
.spin-btn:active:not(:disabled){
  transform:translateY(8px);
  box-shadow:
    0 2px 0 #3a0505,
    0 5px 10px rgba(0,0,0,.6),
    inset 0 2px 0 rgba(255,255,255,.45),
    inset 0 -4px 10px rgba(0,0,0,.45),
    inset 0 0 0 2px rgba(255,215,0,.4);
}
@keyframes spinPulse{
  0%,100%{box-shadow:0 10px 0 #3a0505,0 14px 22px rgba(0,0,0,.6),inset 0 2px 0 rgba(255,255,255,.45),inset 0 -6px 12px rgba(0,0,0,.45),inset 0 0 0 2px rgba(255,215,0,.4),0 0 28px rgba(255,69,0,.4)}
  50%{box-shadow:0 10px 0 #3a0505,0 14px 22px rgba(0,0,0,.6),inset 0 2px 0 rgba(255,255,255,.45),inset 0 -6px 12px rgba(0,0,0,.45),inset 0 0 0 2px rgba(255,215,0,.55),0 0 52px rgba(255,215,0,.7)}
}

/* 拉杆：重型美式拉杆 */
.lever-area{padding-top:6px}
.lever-track{
  width:36px;height:70px;
  background:linear-gradient(180deg,#1a0806,#2a0c06 40%,#140604);
  border:2px solid #000;
  box-shadow:
    inset 0 2px 8px rgba(0,0,0,.9),
    inset 0 0 0 1px #6a5a20,
    0 0 0 1px rgba(0,0,0,.5);
  border-radius:20px;
}
.lever-rod{
  width:9px;height:34px;
  background:
    repeating-linear-gradient(90deg,#404040 0 1px,#e8e8e8 1px 3px,#a8a8a8 3px 4px,#d8d8d8 4px 6px,#505050 6px 7px);
  border-radius:5px;
  box-shadow:0 1px 3px rgba(0,0,0,.6);
}
.lever-knob{
  width:32px;height:32px;top:-20px;
  background:
    radial-gradient(circle at 30% 25%, #fff 0%, #ffb060 20%, #e04020 50%, #7a0505 100%);
  border:1.5px solid rgba(0,0,0,.5);
  box-shadow:
    0 5px 10px rgba(0,0,0,.6),
    inset -4px -4px 8px rgba(0,0,0,.45),
    inset 4px 4px 8px rgba(255,255,255,.35),
    0 0 18px rgba(224,32,32,.5);
}
/* 拉杆弹簧回弹过冲 */
.lever-snap{animation:leverSnap .35s cubic-bezier(.1,.9,.25,1.6)}
@keyframes leverSnap{
  0%{transform:translateX(-50%) translateY(var(--max))}
  55%{transform:translateX(-50%) translateY(-8px)}
  75%{transform:translateX(-50%) translateY(3px)}
  100%{transform:translateX(-50%) translateY(0)}
}

/* 机身更强震动 */
@keyframes shake{
  0%,100%{transform:translate(0,0) rotate(0)}
  10%{transform:translate(-7px,4px) rotate(-.3deg)}
  22%{transform:translate(7px,-4px) rotate(.3deg)}
  34%{transform:translate(-6px,3px) rotate(-.25deg)}
  46%{transform:translate(6px,-3px) rotate(.25deg)}
  58%{transform:translate(-4px,2px) rotate(-.15deg)}
  70%{transform:translate(4px,-2px) rotate(.15deg)}
  82%{transform:translate(-2px,1px)}
  94%{transform:translate(2px,-1px)}
}
.machine.impact{animation:machineImpact .18s ease}
@keyframes machineImpact{0%{transform:translate(0,0)}40%{transform:translate(0,7px)}100%{transform:translate(0,0)}}

/* SPIN 按下时 机身整体轻震 */
.machine.punch{animation:machinePunch .1s ease}
@keyframes machinePunch{0%{transform:translate(0,0) scale(1)}50%{transform:translate(0,3px) scale(1.005)}100%{transform:translate(0,0) scale(1)}}

/* 投币金币飞入动画 */
.coin-fly{
  position:fixed;z-index:9997;pointer-events:none;
  width:24px;height:24px;border-radius:50%;
  background:radial-gradient(circle at 30% 25%, #fff, #FFD700 40%, #FFA500 70%, #8B4513 100%);
  box-shadow:0 0 10px rgba(255,215,0,.8),inset -2px -2px 4px rgba(0,0,0,.35);
  display:flex;align-items:center;justify-content:center;
  font-family:'Luckiest Guy',cursive;font-size:13px;color:#8B4513;
  animation:coinFly 1s cubic-bezier(.2,.7,.25,1) forwards;
}
@keyframes coinFly{
  0%{transform:translate(0,0) rotate(0) scale(1);opacity:1}
  60%{transform:translate(var(--dx),calc(var(--dy) - 40px)) rotate(480deg) scale(1.1);opacity:1}
  100%{transform:translate(var(--dx),var(--dy)) rotate(720deg) scale(.6);opacity:0}
}

/* 中奖数字滚动（钱包数字跳） */
.wallet-amount.roll{animation:walletRoll .45s ease infinite alternate}
@keyframes walletRoll{from{filter:brightness(1)}to{filter:brightness(1.5) saturate(1.3) drop-shadow(0 0 8px rgba(255,215,0,.7))}}

/* 跑马灯加强 */
.marquee{
  padding:7px;gap:4px;
  background:linear-gradient(180deg,#140604,#2a0c06);
  border:1.5px solid #000;
  box-shadow:
    inset 0 2px 6px rgba(0,0,0,.9),
    inset 0 0 0 1px #6a5a20,
    0 0 0 2px rgba(0,0,0,.5);
}
.marquee .bulb{width:10px;height:10px;background:#281410}
.marquee .bulb.on{
  background:radial-gradient(circle at 35% 30%,#fff,#ffd040 40%,#d06010);
  box-shadow:0 0 10px #ffc030,0 0 20px rgba(255,192,48,.7);
}
.marquee .bulb.on.blue{
  background:radial-gradient(circle at 35% 30%,#fff,#90e0ff 40%,#1060c0);
  box-shadow:0 0 10px #40a0ff,0 0 20px rgba(64,160,255,.7);
}
.marquee .bulb.on.red{
  background:radial-gradient(circle at 35% 30%,#fff,#ff9090 40%,#c01010);
  box-shadow:0 0 10px #ff4040,0 0 20px rgba(255,64,64,.7);
}
.marquee .bulb.on.violet{
  background:radial-gradient(circle at 35% 30%,#fff,#d8a0ff 40%,#8010c0);
  box-shadow:0 0 10px #c060ff,0 0 20px rgba(192,96,255,.7);
}

/* 状态条更有赌场味 */
.status{
  margin-top:12px;min-height:34px;
  padding:6px 10px;border-radius:10px;
  background:linear-gradient(180deg,#0a0403,#1a0806);
  border:1.5px solid #000;
  box-shadow:inset 0 0 0 1px #6a5a20,inset 0 2px 6px rgba(0,0,0,.8),0 0 0 1px rgba(0,0,0,.5);
  font-family:'Bungee',cursive;font-size:13px;letter-spacing:1px;
}
.status.tease{
  background:linear-gradient(180deg,#2a1404,#3a1a06);
  color:#FFA500;text-shadow:0 0 14px rgba(255,165,0,.8);
  animation:teaseSlam .25s ease 3;
}
@keyframes teaseSlam{0%{transform:scale(1) translateX(0)}25%{transform:scale(1.06) translateX(-4px)}75%{transform:scale(1.04) translateX(4px)}100%{transform:scale(1) translateX(0)}}
.status.win{
  background:linear-gradient(180deg,#042a14,#063a1a);
  color:#5DFF7A;text-shadow:0 0 16px rgba(93,255,122,.9);
  animation:winSlam .28s ease 3;
}
@keyframes winSlam{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
.status.jackpot{
  font-size:17px;
  background:linear-gradient(90deg,#4a0000 0%,#8B0000 50%,#4a0000 100%);
  color:#FFD700;
}

/* 闪光：z-index 放弹窗之下、之上的视觉层 */
.flash{position:fixed;inset:0;pointer-events:none;z-index:500;opacity:0}
.flash.impact{background:radial-gradient(circle,rgba(255,255,255,.35),transparent 60%);animation:flashFade .25s ease-out forwards}
.flash.win{background:radial-gradient(circle,rgba(255,215,0,.55),rgba(50,205,50,.2) 50%,transparent 75%);animation:flashFade .65s ease-out forwards}
.flash.jackpot{background:radial-gradient(circle,rgba(255,255,255,.7),rgba(255,69,0,.6) 30%,rgba(255,215,0,.3) 55%,transparent 80%);animation:jackpotFlash 1.1s ease-out forwards}
@keyframes jackpotFlash{0%{opacity:0}10%{opacity:1}35%{opacity:.55}55%{opacity:.9}100%{opacity:0}}
.flash.devour{background:radial-gradient(circle,rgba(255,0,0,.7),rgba(139,0,0,.5) 40%,transparent 78%);animation:jackpotFlash 1.1s ease-out forwards}
.status.devour{
  font-size:17px;
  background:linear-gradient(90deg,#4a0000 0%,#8B0000 50%,#4a0000 100%);
  color:#FF4500;text-shadow:0 0 16px rgba(255,0,0,.9);
  animation:winSlam .28s ease 4;
}

/* 粒子放大 — 打击感更足 */
.particle{font-size:24px;animation:particleFly 1.1s cubic-bezier(.2,.7,.25,1) forwards}
@keyframes particleFly{
  0%{opacity:1;transform:translate(0,0) scale(.6) rotate(0)}
  15%{transform:translate(calc(var(--dx)*.1),calc(var(--dy)*.1 - 30px)) scale(1.3) rotate(40deg);opacity:1}
  100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.25) rotate(var(--rot))}
}

/* SPIN按钮按下震动（身体）类由 JS 添加 */
.spin-btn.hit{animation:btnHit .12s ease}
@keyframes btnHit{0%{filter:brightness(1.05)}50%{filter:brightness(1.35) saturate(1.2)}100%{filter:brightness(1.05)}}

/* 中奖符号弹出 */
.symbol.pop{animation:symbolPop .35s cubic-bezier(.17,.67,.3,1.6)}
@keyframes symbolPop{0%{transform:scale(1)}50%{transform:scale(1.22) translateY(-6px)}100%{transform:scale(1)}}
.symbol.jackpot-pop{animation:jackpotPop .45s cubic-bezier(.17,.67,.3,1.8) infinite alternate}
@keyframes jackpotPop{from{transform:scale(1) rotate(-3deg)}to{transform:scale(1.25) rotate(3deg)}}

/* 响应式 */
@media(max-width:420px){
  .cabinet{width:328px}
  .reel{height:200px}
  .symbol{height:66px;font-size:44px}
  .symbol img{height:54px;width:54px}
  .payline{height:66px}
  .spin-btn{height:62px;font-size:26px}
  .lever-track{height:62px;width:30px}

<script>
// ===== 符号配置（加权 + 倍率）=====
// 权重：常见符号权重高（小奖常中），稀有符号权重低
// 倍率：3个一致 = mult × 下注（倍率压低，避免大奖续命拖长游戏）
// 中奖率控制：WIN_RATE=30%（先决定中奖再抽符号）
// 奶蛙=吞钱怪兽：随机出现 1/2/3 只，分别扣 $10/$50/$200，触发率 ≈38%
// 设计目标：净亏 ≈ -$21/把，$250 余额约 12 把破产（至多 15 轮）
const SYMBOLS = [
  { id:'cherry',  emoji:'🍒', weight:55,   mult:2,    name:'樱桃', tier:1 },
  { id:'lemon',   emoji:'🍋', weight:42,   mult:3,    name:'柠檬', tier:1 },
  { id:'orange',  emoji:'🍊', weight:30,   mult:3,    name:'橙子', tier:2 },
  { id:'grape',   emoji:'🍇', weight:22,   mult:4,    name:'葡萄', tier:2 },
  { id:'bell',    emoji:'🔔', weight:14,   mult:4,    name:'铃铛', tier:3 },
  { id:'star',    emoji:'⭐', weight:8,    mult:5,    name:'星星', tier:4 },
  { id:'diamond', emoji:'💎', weight:4,    mult:6,    name:'钻石', tier:5 },
  { id:'seven',   emoji:'7️⃣', weight:2,    mult:8,    name:'幸运7', tier:5 },
  { id:'naiwa',   emoji:null, img:'naiwa.png', weight:3, mult:0, name:'奶蛙', devour:true, tier:6 },
];
const NAIWA_IDX = SYMBOLS.findIndex(s => s.devour);
// 奶蛙扣钱：1只扣$10 / 2只扣$50 / 3只扣$200（"奶蛙降临"全奶蛙斩杀是独立事件，不走此表）
const DEVOUR_LOSS = { 1: 10, 2: 50, 3: 200 };
const TOTAL_WEIGHT = SYMBOLS.reduce((a,s)=>a+s.weight,0);
const N = SYMBOLS.length;

// 根据权重随机选一个符号索引
function weightedPick(){
  let r = Math.random() * TOTAL_WEIGHT;
  for(let i=0;i<N;i++){ r -= SYMBOLS[i].weight; if(r<=0) return i; }
  return N-1;
}

/* ============================================================
   ★★★ 中奖率控制 ★★★
   采用"先决定输赢，再决定符号"机制：
   - WIN_RATE = 25%（先判中奖，玩家每 4 把中一次）
   - 奶蛙随机出现：中奖外的剩余里 70% 触发（约 52% 的把数），
     随机出现 1/2/3 只：1只(40%)扣$10 / 2只(30%)扣$50 / 3只(30%)扣$200
   - ★ 奶蛙降临（独立事件，见 DESCENT）：全奶蛙斩杀，概率随轮次增长
   设计目标：约 20 轮破产
   ============================================================ */
const WIN_RATE = 0.25;
const TOTAL_WEIGHT_NO_JP = SYMBOLS.reduce((a,s)=> a + (s.devour ? 0 : s.weight), 0);

/* ============================================================
   ★★★ 奶蛙降临机制 ★★★
   每回合有概率触发"奶蛙降临"：滚轮全部变成奶蛙，余额清零（斩杀）。
   概率随轮次线性增长，越往后越可能降临：
     P(round) = DESCENT_BASE + round × DESCENT_SLOPE
   设计目标：约 20 轮破产（降临 + 正常亏损共同作用）
   ============================================================ */
const DESCENT_BASE = 0.01;   // 第1轮基础概率 1%
const DESCENT_SLOPE = 0.012; // 每轮 +1.2%（第10轮≈13%，第20轮≈25%）

/* 不含奶蛙的加权抽取（普通中奖用） */
function weightedPickNoJp(){
  let r = Math.random() * TOTAL_WEIGHT_NO_JP;
  for(let i=0;i<N;i++){
    if(SYMBOLS[i].devour) continue;
    r -= SYMBOLS[i].weight;
    if(r<=0) return i;
  }
  // 兜底：返回最后一个非奶蛙符号
  for(let i=N-1;i>=0;i--) if(!SYMBOLS[i].devour) return i;
  return 0;
}

/* 随机洗牌取前 n 个位置 */
function shufflePositions(){
  const arr = [0,1,2];
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

/* 奶蛙扣钱结果：随机出现 1/2/3 只奶蛙，其余位置填非奶蛙符号 */
function drawDevourResult(){
  // 随机决定奶蛙数量：1只(40%) / 2只(30%) / 3只(30%)
  const r = Math.random();
  const count = r < 0.40 ? 1 : (r < 0.70 ? 2 : 3);
  const positions = shufflePositions();
  const result = [weightedPickNoJp(), weightedPickNoJp(), weightedPickNoJp()];
  // 把 count 个位置替换成奶蛙
  for(let i=0;i<count;i++) result[positions[i]] = NAIWA_IDX;
  return result;
}

function drawResult(){
  // 1) 普通中奖：25% 概率三连同一非奶蛙符号（先判中奖）
  if(Math.random() < WIN_RATE){
    const s = weightedPickNoJp();
    return [s, s, s];
  }
  // 2) 奶蛙随机出现：剩余情况里 70% 触发，1/2/3 只奶蛙随机分布（约 52% 的把数）
  if(Math.random() < 0.70){
    return drawDevourResult();
  }
  // 3) 不中：r0 按权重（含奶蛙作单只装饰），r1 强制不同，r2 避开三连
  const r0 = weightedPick();
  let r1 = weightedPick();
  let guard = 0;
  while(r1 === r0 && guard++ < 6) r1 = weightedPick();
  let r2 = weightedPick();
  guard = 0;
  while(r2 === r0 && r2 === r1 && guard++ < 6) r2 = weightedPick();
  // 30% 概率做"两连挑逗"：让 r2 == r0 或 r1，制造差一个的紧张感
  if(Math.random() < 0.30){
    r2 = (Math.random() < 0.5) ? r0 : r1;
  }
  return [r0, r1, r2];
}

// 符号的 HTML（emoji 文本 或 naiwa 图片）

// ===== 状态 =====
let balance = 250;
const BET_OPTIONS = [10, 25, 50, 100];
let betIdx = 0; // 默认 $10
let bet = BET_OPTIONS[betIdx];
let spinning = false;

let totalWagered = 0;

// ===== 音效（打击感 V2：低频金属撞击 + 机械卡嗒 + 螺旋旋转 + 金币瀑布 + 号角大奖）=====
let audioCtx = null;
let soundEnabled = true;
function initAudio(){ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }

/* 预加载目录里的音效文件（奶蛙吞钱 / 输光专用） */
const sfxFile = new Audio('rvra0-eb7gx.wav');
sfxFile.preload = true;
sfxFile.load();
/* 一次性播放（吞钱瞬间用，不循环） */
function playSfxFile(){
  if(!soundEnabled) return;
  try{
    if(audioCtx && audioCtx.state==='suspended') audioCtx.resume();
    sfxFile.loop = false;
    sfxFile.currentTime = 0;
    sfxFile.play().catch(()=>{});
  }catch(e){}
}
/* 循环播放（输光弹窗显示时用，直到关掉弹窗） */
function loopSfxFile(){
  if(!soundEnabled) return;
  try{
    if(audioCtx && audioCtx.state==='suspended') audioCtx.resume();
    sfxFile.loop = true;
    sfxFile.currentTime = 0;
    sfxFile.play().catch(()=>{});
  }catch(e){}
}
/* 停止循环播放（关掉弹窗时用） */
function stopSfxFile(){

    sfxFile.loop = false;

  }catch(e){}
}

/* 震动分级（Android / iOS 13+） */
function buzz(pattern){ if(navigator.vibrate) try{ navigator.vibrate(pattern); }catch(e){} }

/* 通用：生成一段短促的噪声（用于金属咔哒、撞击的"脆声"部分） */
function noiseBurst(dur, gainStart, filterFreq){
  if(!audioCtx) return;
  const sr = audioCtx.sampleRate;
  const len = Math.floor(sr*dur);
  const buf = audioCtx.createBuffer(1, len, sr);
  const data = buf.getChannelData(0);
  for(let i=0;i<len;i++) data[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 2);
  const src = audioCtx.createBufferSource(); src.buffer = buf;
  const bp = audioCtx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value = filterFreq; bp.Q.value=1.2;
  const g = audioCtx.createGain(); g.gain.setValueAtTime(gainStart, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  src.connect(bp); bp.connect(g); g.connect(audioCtx.destination);
  src.start(); src.stop(audioCtx.currentTime + dur + 0.02);
}

/* 通用：振荡器+包络 */
function oscTone(type, freqStart, freqEnd, dur, gainStart, freqType){
  if(!audioCtx) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination);
  o.type = type;
  o.frequency.setValueAtTime(freqStart, audioCtx.currentTime);
  if(freqType==='expo') o.frequency.exponentialRampToValueAtTime(Math.max(freqEnd,0.01), audioCtx.currentTime + dur);
  else o.frequency.linearRampToValueAtTime(freqEnd, audioCtx.currentTime + dur);
  g.gain.setValueAtTime(gainStart, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  o.start(); o.stop(audioCtx.currentTime + dur + 0.02);
}

function playSound(type, severity){
  if(!soundEnabled || !audioCtx) return;
  try{
    const now = audioCtx.currentTime;
    switch(type){
      case 'button':
        // 金属按钮：1个中高频click + 噪声脆响
        noiseBurst(0.035, 0.18, 1800);
        oscTone('square', 620, 880, 0.05, 0.08, 'linear');
        buzz(20);
        break;
      case 'bet':
        oscTone('triangle', 500, 800, 0.05, 0.1, 'linear');
        buzz(12);
        break;
      case 'coin-insert':
        // 投币：金属咣当
        noiseBurst(0.07, 0.25, 1400);
        oscTone('square', 780, 1100, 0.08, 0.09, 'linear');
        setTimeout(()=> oscTone('square', 900, 600, 0.06, 0.07, 'linear'), 60);
        buzz(18);
        break;
      case 'spin': {
        // 螺旋上升旋转：低频 rumble（三角波+锯齿）+ 咔哒启动撞击
        noiseBurst(0.05, 0.3, 900);        // 启动撞击噪声
        oscTone('sawtooth', 80, 260, 0.3, 0.1, 'linear'); // 低频吼
        // 高频小哨音螺旋
        const o=audioCtx.createOscillator(),g=audioCtx.createGain();
        o.connect(g);g.connect(audioCtx.destination);
        o.type='sine';
        o.frequency.setValueAtTime(220,now);
        o.frequency.exponentialRampToValueAtTime(780, now + 0.35);
        g.gain.setValueAtTime(0.06, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
        o.start(); o.stop(now + 0.42);
        buzz([30, 20, 30]);
        break;
      }
      case 'reelstop':
        // 滚轮停轮：重低音撞击 thunk + 高频咔哒 metal CLUNK
        noiseBurst(0.045, 0.35, 700);   // 金属噪声
        oscTone('sawtooth', 140, 60, 0.1, 0.22, 'expo'); // 低频咚
        oscTone('square', 420, 260, 0.07, 0.12, 'linear'); // 咔
        buzz(40);
        break;
      case 'win': {
        // 中奖音阶 + 金币瀑布：先阶梯高音然后金币雨
        [523, 659, 784, 988, 1245, 1568].forEach((f,i)=>{
          const delay = i*0.06;
          setTimeout(()=>{
            oscTone('square', f, f*1.02, 0.22, 0.12, 'linear');
            if(i>=1) noiseBurst(0.02, 0.12, 2600); // 每级加点金属
          }, delay*1000);
        });
        // 金币瀑布：多次 coin 脆响
        for(let i=0;i<12;i++){
          setTimeout(()=>{
            noiseBurst(0.025, 0.14, 2400 + Math.random()*600);
            oscTone('square', 1400 + Math.random()*800, 900 + Math.random()*400, 0.05, 0.05, 'linear');
          }, 380 + i*38);
        }
        buzz([40,30,40,30,60,30,50,30,70]);
        break;
      }
      case 'lose':
        // 失败：低频下滑 + 噪声叹气
        oscTone('sawtooth', 230, 80, 0.42, 0.14, 'expo');
        noiseBurst(0.08, 0.08, 300);
        buzz(60);
        break;
      case 'tease':
        // 差点中奖：短促挑逗音
        oscTone('triangle', 500, 700, 0.1, 0.1, 'linear');
        setTimeout(()=>oscTone('triangle', 700, 500, 0.1, 0.1, 'linear'), 80);
        buzz(25);
        break;
      case 'devour': {
        // 奶蛙扣钱：按数量分级，severity = 1/2/3
        const sev = severity || 1;
        // 只有 3 只奶蛙（饱餐）才播放目录音效文件；2 只叠加短音效
        if(sev >= 3) playSfxFile();
        // 叠加低频咆哮增强恐怖感（数量越多越强越长）
        const dg = audioCtx.createGain();
        const df = audioCtx.createBiquadFilter();
        df.type='lowpass'; df.frequency.value = sev >= 3 ? 400 : (sev === 2 ? 500 : 700);
        const do1 = audioCtx.createOscillator();
        do1.type='sawtooth';
        const startF = sev >= 3 ? 90 : (sev === 2 ? 110 : 140);
        const endF   = sev >= 3 ? 45 : (sev === 2 ? 55 : 80);
        const dur    = sev >= 3 ? 0.8 : (sev === 2 ? 0.5 : 0.3);
        do1.frequency.setValueAtTime(startF, now);
        do1.frequency.exponentialRampToValueAtTime(endF, now + dur);
        dg.gain.setValueAtTime(sev >= 3 ? 0.22 : (sev === 2 ? 0.16 : 0.10), now);
        dg.gain.exponentialRampToValueAtTime(0.001, now + dur);
        do1.connect(df); df.connect(dg); dg.connect(audioCtx.destination);
        do1.start(now); do1.stop(now + dur + 0.02);
        break;
      }
      case 'lever-pull':
        // 拉杆下拉：嘎吱噪声+低沉撞击
        noiseBurst(0.06, 0.25, 500);
        oscTone('sawtooth', 200, 120, 0.12, 0.18, 'expo');
        buzz(50);
        break;
      case 'lever-snap':
        // 弹簧回弹：脆金属 "Ting!"
        oscTone('square', 1400, 2000, 0.06, 0.09, 'linear');
        noiseBurst(0.03, 0.18, 2200);
        buzz(15);
        break;
    }
  }catch(e){}
}

function rebuildStrip(idx){

// ===== 滚轮旋转 =====
function spinReel(idx, targetIdx, duration){
  return new Promise(resolve=>{
    const strip = reelStrips[idx];
    const cycleH = N * SYMBOL_HEIGHT;
    const match = strip.style.transform.match(/-?\d+\.?\d*/);
    const currentY = match ? -parseFloat(match[0]) : 0;
    const normCurrent = ((currentY % cycleH)+cycleH)%cycleH;
    const targetOffset = ((targetIdx - 1 + N) % N) * SYMBOL_HEIGHT;
    const rotations = 5 + idx;
    let finalY = rotations*cycleH + targetOffset;
    if(finalY <= normCurrent) finalY += cycleH;
    const distance = finalY - normCurrent;
    const startY = normCurrent;
    const startTime = performance.now();
    let stopped = false;

    // 停轮前"刹车"：最后 ~18% 距离用更猛烈的 deceleration，制造顿挫感
    function animate(now){
      const elapsed = now - startTime;
      const t = Math.min(elapsed/duration, 1);
      // easeOutBack：末尾会先过冲再回正，视觉上的"卡入"顿挫感
      const c1 = 1.70158;
      const c3 = c1 + 1;
      let eased;
      if(t < 1){
        // 大部分区间用 easeOutQuart 快速下降
        eased = 1 - Math.pow(1-t, 4);
        // 最后 3% 叠加 bounce-like 过冲
        if(t > 0.97){
          const u = (t - 0.97) / 0.03; // 0..1
          eased = eased * (1-u) + (1 + (c3 * Math.pow(u-1,3) + c1 * Math.pow(u-1,2))) * u;
        }
      } else {
        eased = 1;
      }
      const offset = startY + distance*eased;
      strip.style.transform = `translateY(${-offset}px)`;
      // 性能：去掉每帧 filter blur（GPU 重绘开销大，手机卡顿主因），仅在中段用 CSS 模糊类
      if(t<1){ requestAnimationFrame(animate); }
      else {
        strip.style.transform = `translateY(${-targetOffset}px)`;
        if(!stopped){
          stopped=true;
          playSound('reelstop');
          // 滚轮本体：视觉顿挫 jolt + 屏幕冲击闪光 + 机身微震
          const reelEl = document.getElementById('reel-el-' + idx);
          reelEl.classList.remove('jolt'); void reelEl.offsetWidth; reelEl.classList.add('jolt');
          setTimeout(()=> reelEl.classList.remove('jolt'), 260);
          flashScreen('impact');
          machine.classList.remove('impact'); void machine.offsetWidth; machine.classList.add('impact');
          setTimeout(()=> machine.classList.remove('impact'), 200);
        }
        resolve();
      }
    }
    requestAnimationFrame(animate);
  });
}

/* 投币金币飞入：从 SPIN 按钮飞到钱包，体现"扣钱"的真实感 */
function coinFlyToWallet(count){
  const btnRect = spinBtn.getBoundingClientRect();
  const wRect = balanceEl.getBoundingClientRect();
  count = count || 2;
  for(let i=0;i<count;i++){
    const c = document.createElement('div');
    c.className = 'coin-fly';
    c.textContent = '$';

    c.style.top = (btnRect.top + btnRect.height*0.3) + 'px';
    const tx = (wRect.left + wRect.width/2) - parseFloat(c.style.left);
    const ty = (wRect.top + wRect.height/2) - parseFloat(c.style.top);
    c.style.setProperty('--dx', tx+'px');
    c.style.setProperty('--dy', ty+'px');

/* 让中奖线处的 3 个符号单独弹出动画（pop / jackpot-pop） */
function popWinSymbols(isJackpot){
  for(let i=0;i<3;i++){
    const strip = reelStrips[i];
    const cycleH = N * SYMBOL_HEIGHT;
    const match = strip.style.transform.match(/-?\d+\.?\d*/);
    const y = match ? -parseFloat(match[0]) : 0;
    const idx = Math.round(y / SYMBOL_HEIGHT);
    // strip 里的 DOM 顺序是符号重复多次拼的，取 strip 正中间的那个
    const all = strip.querySelectorAll('.symbol');
    // 中奖行是 Math.floor((y + strip.parent.offsetHeight/2)/SH)，对应索引
    const parentH = strip.parentElement.offsetHeight;
    const row = Math.floor((y + parentH/2) / SYMBOL_HEIGHT);
    const target = all[row] || all[Math.floor(all.length/2)];
    if(target){
      const cls = isJackpot ? 'jackpot-pop' : 'pop';
      target.classList.remove(cls); void target.offsetWidth; target.classList.add(cls);
    }
  }
}

function spawnParticles(x,y,count,emojis){
  // 性能：手机端大幅削减粒子数量，避免频繁 DOM 创建拖慢渲染
  const isMobile = window.innerWidth <= 420;
  if(isMobile) count = Math.ceil(count * 0.4);
  emojis = emojis || ['⭐','✨','💫','🌟','✴️'];
  // 用 DocumentFragment 批量插入，减少重排
  const frag = document.createDocumentFragment();
  const elems = [];
  for(let i=0;i<count;i++){
    const p=document.createElement('div');
    p.className='particle';
    p.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    p.style.left=x+'px';p.style.top=y+'px';
    const angle=(Math.PI*2*i/count)+Math.random()*0.5;
    const dist=60+Math.random()*90;
    p.style.setProperty('--dx',Math.cos(angle)*dist+'px');
    p.style.setProperty('--dy',Math.sin(angle)*dist+'px');
    p.style.setProperty('--rot',(Math.random()*720-360)+'deg');
    frag.appendChild(p);
    elems.push(p);
  }
  document.body.appendChild(frag);
  setTimeout(()=>{ elems.forEach(p=>p.remove()); },1000);
}

// ===== 开始旋转 =====
async function startSpin(){
  if(spinning) return;
  if(balance < bet){
    statusEl.textContent = '余额不足，请降低下注！';
    statusEl.className = 'status tease';
    playSound('lose');
    return;
  }
  initAudio();
  spinning = true;
  spinBtn.classList.remove('pulsing');
  spinBtn.disabled = true;

  // SPIN 按钮"砸下去"打击感：按下高亮、机身轻震
  spinBtn.classList.add('hit');
  setTimeout(()=>spinBtn.classList.remove('hit'), 150);
  machine.classList.remove('punch'); void machine.offsetWidth; machine.classList.add('punch');
  setTimeout(()=>machine.classList.remove('punch'), 120);

  // 扣除下注 + 统计
  balance -= bet;
  totalWagered += bet;
  spinCount++;
  gameRound++;  // 回合数 +1
  updateBalance('loss');
  updateSpinCount();

  // 投币金币飞入动画：从SPIN按钮飞进钱包
  coinFlyToWallet(Math.min(5, Math.max(2, Math.ceil(bet/6))));
  playSound('coin-insert');

  setTimeout(()=>{
    playSound('spin');
  }, 80);
  // 开转：手柄重击感震动（让玩家"感受到"机器启动）
  buzz([25, 15, 35]);

  // 清除上轮高亮
  [0,1,2].forEach(i=>{
    const rl = document.getElementById('reel-el-'+i);
    rl.classList.remove('win-highlight','jackpot-highlight','devour-highlight');
    rl.querySelectorAll('.symbol').forEach(sy => sy.classList.remove('pop','jackpot-pop'));
  });
  payline.classList.remove('tease','win','jackpot','devour');

  statusEl.textContent = '旋转中... 🎰';
  statusEl.className = 'status';

  // ★ 奶蛙降临：随轮次增长的随机斩杀事件（全奶蛙，余额清零）
  let r0, r1, r2, forcedSlay = false, isDescent = false;
  const descentProb = DESCENT_BASE + gameRound * DESCENT_SLOPE;
  if(Math.random() < descentProb){
    r0 = r1 = r2 = NAIWA_IDX;
    forcedSlay = true;
    isDescent = true;
    // ★ 装都不装：滚轮条全部填充奶蛙，旋转时整屏都是奶蛙
    [0,1,2].forEach(fillStripAllNaiwa);
  } else {
    [r0, r1, r2] = drawResult();
  }

  const promises = [
    spinReel(0, r0, 1500),
    spinReel(1, r1, 2050),
    spinReel(2, r2, 2700),
  ];

  // 差点中奖 tease：前两个相同时，第三个减速时弹挑逗文案+音效
  if(r0 === r1 && r0 !== NAIWA_IDX){
    setTimeout(()=>{
      statusEl.textContent = `${symbolLabel(r0)}${symbolLabel(r0)} ... 差一个！`;
      statusEl.className = 'status tease';
      payline.classList.add('tease');
      playSound('tease');
    }, 2180);
  }

  await Promise.all(promises);
  payline.classList.remove('tease');

  // 判定
  let winAmountVal = 0;
  let isDevour = false;
  let devourCount = 0;   // 奶蛙出现数量 1/2/3
  let devourLoss = 0;    // 本把扣钱金额
  let winSymIdx = -1;
  let tier = 0;

  // 统计三个位置中奶蛙数量：1只扣10 / 2只扣50 / 3只扣200；奶蛙降临=斩杀（清零）
  const naiwaCount = [r0, r1, r2].filter(i => SYMBOLS[i].devour).length;
  let isSlay = false;  // 奶蛙降临斩杀标记
  if(naiwaCount > 0){
    isDevour = true;
    devourCount = naiwaCount;
    if(isDescent){
      // ★ 奶蛙降临：余额直接清零，斩杀
      isSlay = true;
      devourLoss = balance;
      balance = 0;
    } else {
      devourLoss = DEVOUR_LOSS[naiwaCount];
      balance -= devourLoss;
    }
  } else if(r0 === r1 && r1 === r2){
    winSymIdx = r0;
    winAmountVal = SYMBOLS[r0].mult * bet;
    tier = SYMBOLS[r0].tier || 1;
    winCount++;
    balance += winAmountVal;
  }

  updateSpinCount();

  if(isDevour){
    // ===== 奶蛙扣钱分支（按数量分级：1只扣10 / 2只扣50 / 3只扣200）=====
    // 只高亮出现奶蛙的滚轮
    const naiwaPositions = [r0,r1,r2].map((v,i)=> SYMBOLS[v].devour ? i : -1).filter(i=>i>=0);
    naiwaPositions.forEach(i=>{
      document.getElementById('reel-el-'+i).classList.add('devour-highlight');
    });
    // 文案 + 震动 + 粒子按奶蛙数量分级（降临=斩杀）
    const devourMsgs = {
      1: `🐸 奶蛙咬了一口 -$${devourLoss}`,
      2: `🐸🐸 奶蛙咬掉一块肉 -$${devourLoss}！`,
      3: isDescent ? `🐸🐸🐸 奶蛙降临！第${gameRound}回合，斩杀！` : `🐸🐸🐸 奶蛙饱餐一顿 -$${devourLoss}！`,
    };
    statusEl.textContent = devourMsgs[devourCount];
    statusEl.className = 'status devour';
    payline.classList.add('devour');
    flashScreen('devour');
    playSound('devour', devourCount);
    // 震动分级：1只轻咬 / 2只中震 / 3只斩杀（超长恐慌颤抖）
    if(devourCount === 1){
      buzz([60,30,90]);
    } else if(devourCount === 2){
      buzz([100,40,120,40,140]);
      machine.classList.add('shake');
      setTimeout(()=>machine.classList.remove('shake'),360);
    } else {
      // 斩杀：极强震动 + 长震
      buzz([200,80,200,80,180,60,160,60,140,60,120,80,200,80,220,60,250]);
      machine.classList.add('shake');
      setTimeout(()=>machine.classList.remove('shake'),1200);
    }
    // 粒子按数量分级喷射（斩杀时大量奶蛙+骷髅爆炸）
    const rect = document.getElementById('reel-window').getBoundingClientRect();
    const cx = rect.left+rect.width/2, cy = rect.top+rect.height/2;
    const burstN = isSlay ? 50 : devourCount === 2 ? 24 : 14;
    spawnParticles(cx, cy, burstN, ['🐸','💀','💨','🩸','⛔','💔','💥','☠️']);
    if(devourCount >= 2) setTimeout(()=>spawnParticles(cx, cy, Math.floor(burstN*0.6), ['🐸','💀','💨','💢','💥']), 300);
    // 钱包抖动（红色）
    balanceEl.classList.remove('roll'); void balanceEl.offsetWidth; balanceEl.classList.add('roll');
    setTimeout(()=>balanceEl.classList.remove('roll'), isSlay ? 2200 : devourCount === 2 ? 1200 : 900);
    updateBalance('loss');

    // 余额 ≤ 0（含负数）：斩杀或吞光 → 弹结局弹窗
    if(balance <= 0){
      setTimeout(()=> showDevouredModal(forcedSlay ? 'force' : 'slay'), 1100);
    }
  } else if(winAmountVal > 0){
    // 中奖符号逐个弹出
    popWinSymbols(false);

    [0,1,2].forEach(i=>{
      const el = document.getElementById('reel-el-'+i);
      el.classList.add('win-highlight');
    });

    statusEl.textContent = `中奖！${symbolLabel(winSymIdx)}×3 +$${winAmountVal}`;
    statusEl.className = 'status win';
    payline.classList.add('win');
    flashScreen('win');
    playSound('win');
    // 分级震动：tier 越高震动越长越强
    if(tier >= 5){
      buzz([80,30,100,30,120,30,140]);
      machine.classList.add('shake');
      setTimeout(()=>machine.classList.remove('shake'),420);
    } else if(tier >= 3){
      buzz([60,25,80,25,100]);
      machine.classList.add('shake');
      setTimeout(()=>machine.classList.remove('shake'),360);
    } else {
      buzz([50,20,70]);
    }
    const rect = document.getElementById('reel-window').getBoundingClientRect();
    const cx = rect.left+rect.width/2, cy = rect.top+rect.height/2;
    const burstCount = tier >= 5 ? 28 : tier >= 3 ? 20 : tier >= 2 ? 16 : 12;
    spawnParticles(cx, cy, burstCount, tier >= 4 ? ['💰','⭐','✨','💎','🌟'] : ['⭐','✨','💫','🌟','✴️']);
    if(tier >= 3) setTimeout(()=>spawnParticles(cx, cy, Math.floor(burstCount*0.6), ['💰','✨','⭐']), 220);
    // 钱包 roll 弹跳
    balanceEl.classList.remove('roll'); void balanceEl.offsetWidth; balanceEl.classList.add('roll');
    setTimeout(()=>balanceEl.classList.remove('roll'), 900);
    updateBalance('gain');

    // 延迟弹出中奖弹窗
    setTimeout(()=> showWinModal(winAmountVal, false, winSymIdx), 600);
  } else {
    // 未中奖
    const twoOfKind = r0===r1 || r1===r2 || r0===r2;
    if(twoOfKind){
      const msgs = [
        '差一个！再拉一次！','差点就中了... 🤞','就差一点点！','感觉下次能中！'
      ];
      statusEl.textContent = msgs[Math.floor(Math.random()*msgs.length)];
      statusEl.className = 'status tease';
      if(r0===r1) playSound('tease');
      else playSound('lose');
    } else {
      const msgs = [
        '没中！下次一定！','运气在路上！','再拉一把！','快了快了！','小心奶蛙出没～'
      ];
      statusEl.textContent = msgs[Math.floor(Math.random()*msgs.length)];
      statusEl.className = 'status miss';
      playSound('lose');
    }
  }

  spinBtn.disabled = false;
  if(balance >= bet && balance > 0) spinBtn.classList.add('pulsing');
  spinning = false;

  // 普通输光检测（余额因下注降至 ≤0，且不是奶蛙吞钱——吞钱已单独处理）
  if(balance <= 0 && !isDevour && winAmountVal === 0){
    setTimeout(()=>checkBroke(), 700);
  }
}

// ===== SPIN 按钮触发 =====
spinBtn.addEventListener('click',()=>{
  initAudio(); playSound('button');
  startSpin();
});
// 空格键也能旋转
document.addEventListener('keydown',e=>{
  if(e.code==='Space' && !spinning){
    e.preventDefault();
    initAudio(); playSound('button');
    startSpin();
  }
});

// ===== 拉杆触发（点击或拖拽）：重型打击感版本 =====
const MAX_PULL = 46;
let dragging = false, dragStartY = 0, dragOffset = 0;

/* 给杆/球应用回弹 snap 动画（CSS overshoot 动画） */
function applyLeverSnap(maxPull){
  rod.classList.remove('lever-snap'); knob.classList.remove('lever-snap');
  rod.style.setProperty('--max', maxPull+'px');
  knob.style.setProperty('--max', maxPull+'px');
  // 先固定在 max，然后切换到 snap 动画类来做回弹
  rod.style.transform = '';
  knob.style.transform = '';
  rod.classList.add('lever-snap');
  knob.classList.add('lever-snap');
  setTimeout(()=>{ rod.classList.remove('lever-snap'); knob.classList.remove('lever-snap'); }, 370);
}

function pullLever(){
  if(spinning) return;
  initAudio();
  playSound('lever-pull');
  rod.style.transform = `translateX(-50%) translateY(${MAX_PULL}px)`;
  knob.style.transform = `translateX(-50%) translateY(${MAX_PULL}px)`;
  spawnParticles(knob.getBoundingClientRect().left+16, knob.getBoundingClientRect().top+16, 6, ['✨','💫','⭐']);
  machine.classList.add('shake');
  // 180ms 后弹簧回弹，然后开始旋转
  setTimeout(()=>{
    playSound('lever-snap');
    applyLeverSnap(MAX_PULL);
    setTimeout(()=>{
      machine.classList.remove('shake');
      startSpin();
    }, 220);
  }, 180);
}
function onDragStart(y){ if(spinning) return; dragging=true; dragStartY=y; dragOffset=0; playSound('lever-pull'); }
function onDragMove(y){ if(!dragging) return; dragOffset=Math.max(0,Math.min(MAX_PULL,dragStartY-y)); rod.style.transform=`translateX(-50%) translateY(${dragOffset}px)`; knob.style.transform=`translateX(-50%) translateY(${dragOffset}px)`; }
function onDragEnd(){
  if(!dragging) return; dragging=false;
  if(dragOffset > MAX_PULL*0.55){
    // 拉够距离，锁到最大，然后 snap 回弹 + start
    const r=knob.getBoundingClientRect(); spawnParticles(r.left+16,r.top+16,8,['✨','💫','⭐']);
    machine.classList.add('shake');
    setTimeout(()=>{
      playSound('lever-snap');
      applyLeverSnap(dragOffset > MAX_PULL ? MAX_PULL : dragOffset);
      setTimeout(()=>{ machine.classList.remove('shake'); startSpin(); }, 220);
    }, 120);
  } else {
    // 不够距离：弹回原位
    applyLeverSnap(dragOffset);
  }
}
knob.addEventListener('mousedown',e=>{e.preventDefault();onDragStart(e.clientY)});
document.addEventListener('mousemove',e=>onDragMove(e.clientY));
document.addEventListener('mouseup',onDragEnd);
knob.addEventListener('touchstart',e=>{e.preventDefault();onDragStart(e.touches[0].clientY)},{passive:false});
document.addEventListener('touchmove',e=>{if(dragging)e.preventDefault();onDragMove(e.touches[0].clientY)},{passive:false});
document.addEventListener('touchend',onDragEnd);
knob.addEventListener('click',()=>{ if(!dragging && dragOffset===0 && !spinning) pullLever(); });

// 防止移动端双击缩放
document.addEventListener('gesturestart',e=>e.preventDefault());
</script>
